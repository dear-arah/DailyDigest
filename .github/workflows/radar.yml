name: radar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: radar
  cancel-in-progress: false

permissions:
  contents: write
  models: read

env:
  STATE_REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install .

      - name: Load state
        run: |
          if git ls-remote --exit-code --heads "$STATE_REMOTE" state >/dev/null 2>&1; then
            git clone --quiet --depth 1 --branch state "$STATE_REMOTE" state-repo
          else
            git init --quiet -b state state-repo
          fi

      - name: Collect, analyze and post
        env:
          DISCORD_WEBHOOK_NEWS: ${{ secrets.DISCORD_WEBHOOK_NEWS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m radar run --channel config/channels/news.yaml --state state-repo/news.json

      - name: Save state
        if: always()
        run: |
          cd state-repo
          git add -A
          if git diff --cached --quiet && git rev-parse --verify --quiet HEAD >/dev/null; then
            exit 0
          fi
          git checkout --quiet --orphan snapshot
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit --quiet -m "chore: update state"
          git push --quiet --force "$STATE_REMOTE" snapshot:state
