name: news
webhook_env: DISCORD_WEBHOOK_URL
sources_file: config/sources.yaml
context_file: config/agora-context.md

# An item is analyzed only if its title or text contains one of these words (plural forms match too).
# Keep this list about voice and conversational AI. Bare company names (openai, anthropic, gemini) and
# generic terms (llm, multimodal) are left out on purpose: they let general AI news through.
keywords:
  # voice and conversational AI
  - voice ai
  - voice agent
  - voice assistant
  - voice mode
  - voice cloning
  - voice model
  - conversational ai
  - conversational agent
  - advanced voice
  - gemini live
  - live api
  - ai agent
  - mcp
  # speech and real-time models
  - realtime
  - real-time
  - speech
  - speech-to-text
  - text-to-speech
  - tts
  - asr
  - stt
  - transcription
  - turn detection
  - barge-in
  # real-time communication and telephony
  - webrtc
  - rtc
  - telephony
  - sip
  - ivr
  - contact center
  - call center
  - avatar
  # companies and frameworks in the space
  - livekit
  - pipecat
  - vapi
  - retell
  - deepgram
  - elevenlabs
  - cartesia
  - assemblyai
  - twilio
  - vonage
  - agora
  # developer community
  - hackathon
  - devrel

threshold: 7
max_posts_per_run: 8
max_age_hours: 48

# Items whose title or link matches any of these patterns (case-insensitive) are dropped before analysis.
# They catch evergreen marketing pages ("X alternative", "A vs B") that are not news.
exclude:
  - '\balternatives?\b'
  - '/(vs|compare|alternatives?)/'
  - '-vs-'
  - '^\s*[-–—]\s'
  - '/projects/new'
  - '/(product|products|solutions?|pricing)/'
  - '\bthe most accurate\b'
  - '\bthe [a-z ]{0,40}api ranked #?1\b'

# Tried in this order. A provider without its key in the environment is skipped.
providers:
  - {name: gemini, model: gemini-3.5-flash}
  - {name: groq, model: openai/gpt-oss-120b}
  - {name: github, model: openai/gpt-4.1-mini}
